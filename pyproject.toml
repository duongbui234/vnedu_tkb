[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "vnedu-tkb-core"
version = "0.2.0"
description = "Standalone hard-feasibility scheduling core for single and double periods"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic==2.14.1"]

[project.optional-dependencies]
solver = ["ortools==9.15.6755"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2", "mypy==2.4.0"]

[project.scripts]
tkb-core = "tkb_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tkb_core"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/tkb_core",
    "/tests",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
    "/docs/assumptions.md",
    "/docs/domain-model.md",
    "/docs/solver-design.md",
    "/docs/constraint-catalog.md",
    "/docs/phase-1-report.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["research", "reverse-engineering"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/tkb_core"]
strict = true
plugins = ["pydantic.mypy"]

